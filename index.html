<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kid Games</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  body { background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 24px; user-select: none; }
  h1 { font-size: clamp(32px, 6vw, 56px); font-weight: 800; opacity: .9; }
  #games { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; width: min(92vw, 900px); }
  a.game {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    aspect-ratio: 1.3; border-radius: 28px; text-decoration: none; color: #fff;
    font-size: clamp(28px, 4.5vw, 44px); font-weight: 800; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    transition: transform .08s;
  }
  a.game:active { transform: scale(.97); }
  a.game .icon { font-size: clamp(70px, 12vw, 120px); line-height: 1; }
  #colors { background: linear-gradient(135deg, #d42020, #ffe119 30%, #3cb44b 55%, #4363d8 80%, #911eb4); }
  #pitch  { background: linear-gradient(135deg, #1f2f8a, #469990); }
</style>
</head>
<body>
  <h1>Pick a game</h1>
  <div id="games">
    <a class="game" id="colors" href="colors.html"><span class="icon">🎨</span>Colors</a>
    <a class="game" id="pitch"  href="pitch.html"><span class="icon">🎵</span>Pitch</a>
  </div>
</body>
</html>
